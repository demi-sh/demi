# Jush and Caddy, which obtains the certificate for JUSH_DOMAIN and serves
# Jush over HTTPS (docs/delivery/docker-compose.md):
#
#   JUSH_DOMAIN=jush.example.com docker compose up -d
#
# The domain's DNS names this machine, whose ports 80 and 443 are free. With
# a proxy of your own, drop the caddy service, publish port 3271 of jush, and
# have the proxy pass Host and Origin unchanged and allow WebSocket upgrades.
name: jush

services:
  jush:
    image: ghcr.io/jush-ai/jush:${JUSH_TAG:-latest}
    restart: unless-stopped
    # Clouds run on Simple Isolation in a container. To let the master choose
    # gVisor in Settings › Cloud, which keeps each Cloud's network apart,
    # uncomment both lines marked gVisor: the container gets the host's
    # privileges, and gVisor's Clouds a resolver they can reach, since
    # Docker's own, 127.0.0.11, answers only inside the container.
    # privileged: true  # gVisor
    environment:
      JUSH_BACKEND_PUBLIC_URL: https://${JUSH_DOMAIN:?set JUSH_DOMAIN to the domain Jush is reached at}
      # JUSH_MANAGED_DNS: 1.1.1.1  # gVisor
    volumes:
      - jush:/opt/jush
    # A stop saves each running Cloud first.
    stop_grace_period: 5m

  caddy:
    image: caddy:2
    restart: unless-stopped
    command: caddy reverse-proxy --from ${JUSH_DOMAIN} --to jush:3271
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - caddy:/data

volumes:
  jush:
  caddy:
