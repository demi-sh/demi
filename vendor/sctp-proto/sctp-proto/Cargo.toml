    "TransportConfig::with_congestion_window_floor sets the least the congestion window and the slow start threshold ever are, at start, in fast recovery and after a T3-rtx timeout, so a sender that paces itself, such as a live view's, runs without SCTP's congestion control while its loss recovery stays (upstream through 0.10.8 has no such setting)",
    "The release's tests, benchmarks, examples and CI files are left out",
