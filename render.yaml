# Jush on Render (docs/delivery/render.md): one web service with a disk at
# /opt/jush, which also holds attachments, since Render has no object storage.
# Render's deploy address reads this file from the repository's root.
services:
  - type: web
    name: jush
    runtime: image
    image:
      url: ghcr.io/jush-ai/jush:latest
    plan: starter
    healthCheckPath: /api/update
    # Jush updates itself in Settings › Updates.
    autoDeployTrigger: "off"
    disk:
      name: jush
      mountPath: /opt/jush
      sizeGB: 5
    envVars:
      - key: PORT
        value: "3271"
      - key: JUSH_BACKEND_PUBLIC_URL
        fromService:
          type: web
          name: jush
          envVarKey: RENDER_EXTERNAL_URL
