[package]
name = "jush-provider-registry"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
# No doc examples.
test = false
doctest = false
bench = false

[dependencies]
jush-shared-types = { path = "../shared-types" }
jush-provider-common = { path = "../provider-common" }
jush-provider-anthropic-api = { path = "../provider-anthropic-api" }
jush-provider-openai-api = { path = "../provider-openai-api" }
jush-web-api-protocol = { path = "../web-api-protocol" }
futures-util.workspace = true
garde.workspace = true
hex = "0.4"
icu_collator = "2"
jiff.workspace = true
reqwest = { workspace = true, features = ["rustls", "stream"] }
serde.workspace = true
serde_json.workspace = true
serde_json_canonicalizer = "0.3"
serde_with.workspace = true
sha2 = "0.10"
thiserror.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tracing.workspace = true
url = { version = "2", features = ["serde"] }
