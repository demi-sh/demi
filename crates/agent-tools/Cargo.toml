[package]
name = "jush-agent-tools"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
# No doc examples.
test = false
doctest = false
bench = false

[features]
# A device type for agents without shell tools (`agent_tools::testing`).
testing = []

[dependencies]
jush-command-protocol = { path = "../command-protocol" }
bytes.workspace = true
jush-conversation-lane-protocol = { path = "../conversation-lane-protocol" }
jush-agent-session = { path = "../agent-session" }
jush-agent-store = { path = "../agent-store" }
jush-agent-transcript = { path = "../agent-transcript" }
jush-shared-types = { path = "../shared-types" }
jush-provider-common = { path = "../provider-common" }
jush-device-interface = { path = "../device-interface" }
futures-util.workspace = true
garde.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_path_to_error = "0.1"
# The one parser of a project's workflow files, which validates with garde
# and names the line and field of what is wrong (`workflow.rs`).
serde-saphyr = { version = "1", default-features = false, features = ["deserialize", "garde"] }
serde_with.workspace = true
tokio.workspace = true
tokio-util.workspace = true
thiserror.workspace = true
tracing.workspace = true
