[package]
name = "jush-agent-store"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
# No doc examples.
test = false
doctest = false
bench = false

[features]
# An in-memory tree store and blob namespace and the values the compaction
# tests build on (`agent_store::testing`).
testing = []

[dependencies]
bytes.workspace = true
jush-command-protocol = { path = "../command-protocol" }
jush-conversation-lane-protocol = { path = "../conversation-lane-protocol" }
jush-shared-types = { path = "../shared-types", features = ["mp4"] }
jush-provider-common = { path = "../provider-common" }
jush-device-interface = { path = "../device-interface" }
jush-device-paths = { path = "../device-paths" }
futures-util.workspace = true
garde.workspace = true
# Fits an image as it enters a transcript: only the codecs of the types a
# model reads, and no threads.
image = { version = "0.25", default-features = false, features = ["gif", "jpeg", "png", "webp"] }
# Reads a video's size in pixels from its container's header: MP4 and
# QuickTime, and WebM, in one parser.
nom-exif = "3.8"
serde.workspace = true
thiserror.workspace = true
tokio.workspace = true
