[package]
name = "jush-plugin-widget"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
# No doc examples.
test = false
doctest = false
bench = false

[dependencies]
jush-command-package-browser-protocol = { path = "../../plugin-browser/protocol" }
jush-command-protocol = { path = "../../command-protocol" }
jush-command-declarations = { path = "../../command-declarations" }
jush-device-interface = { path = "../../device-interface" }
jush-plugin-interface = { path = "../../plugin-interface" }
jush-shared-types = { path = "../../shared-types" }
# The named character references a page's title reads (`src/page.rs`).
entities = "1"
futures-util.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true

[build-dependencies]
# The vendored libraries' gzip copies (`build.rs`).
flate2 = "1"
