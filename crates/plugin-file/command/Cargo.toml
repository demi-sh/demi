[package]
name = "jush-file"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
# No doc examples.
test = false
doctest = false
bench = false

[[bin]]
name = "jush-file"
path = "src/main.rs"
test = false

[dependencies]
bytes.workspace = true
jush-shared-artifacts = { path = "../../shared-artifacts" }
jush-command-protocol = { path = "../../command-protocol" }
jush-command-sdk = { path = "../../command-sdk" }
jush-shared-types = { path = "../../shared-types", features = ["whole-image"] }
jush-command-package-file-protocol = { path = "../protocol" }
jush-shared-gates = { path = "../../shared-gates" }
jush-shared-cli = { path = "../../shared-cli", features = ["device-allocator"] }
# Reads a viewed medium's size from its header: only the codecs of the
# types a model reads.
image = { version = "0.25", default-features = false, features = ["gif", "jpeg", "png", "webp"] }
# Reads a video's size and length from its container's header: MP4 and
# QuickTime, and WebM, in one parser.
nom-exif = "3.8"
regex = "1"
shlex = "2"
similar = "2"
strsim = "0.11"
thiserror.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tracing.workspace = true
