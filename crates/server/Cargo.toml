[package]
name = "jush-server"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "jush-server"
path = "src/main.rs"
test = false
doctest = false
bench = false

[dependencies]
clap = { version = "4", features = ["derive"] }
jush-backend-database = { path = "../backend-database" }
jush-machine-manager-protocol = { path = "../machine-manager-protocol" }
# The next runner release's record and the backend's management
# socket.
jush-runner-protocol = { path = "../runner-protocol" }
jush-shared-artifacts = { path = "../shared-artifacts" }
jush-shared-cli = { path = "../shared-cli" }
jush-shared-types = { path = "../shared-types" }
# The supervisor's socket, which a container's jush-server asks.
jush-supervisor-protocol = { path = "../supervisor-protocol" }
# `GET /api/update`, which an upgrade asks while the backend starts.
jush-web-api-protocol = { path = "../web-api-protocol" }
dotenvy = "0.15"
jiff.workspace = true
rustix = { version = "1", features = ["fs", "mount", "process", "thread"] }
semver = { workspace = true, features = ["serde"] }
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10"
tar = { version = "0.4", default-features = false }
tempfile = "3"
thiserror.workspace = true
tokio.workspace = true
tokio-util.workspace = true
url = "2"
which = "8"
zstd = { version = "0.13", default-features = false }

[target.'cfg(target_os = "linux")'.dependencies]
jush-shared-processes = { path = "../shared-processes" }
