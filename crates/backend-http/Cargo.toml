[package]
name = "jush-backend-http"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
# No doc examples.
test = false
doctest = false
bench = false

[dependencies]
jush-conversation-lane-protocol = { path = "../conversation-lane-protocol" }
jush-agent-store = { path = "../agent-store" }
jush-shared-artifacts = { path = "../shared-artifacts" }
jush-backend-accounts = { path = "../backend-accounts" }
jush-backend-cloud = { path = "../backend-cloud" }
jush-backend-device-access = { path = "../backend-device-access" }
jush-backend-blobs = { path = "../backend-blobs" }
jush-backend-providers = { path = "../backend-providers" }
jush-backend-runners = { path = "../backend-runners" }
jush-backend-user-shard = { path = "../backend-user-shard" }
jush-backend-database = { path = "../backend-database" }
jush-backend-page-sync = { path = "../backend-page-sync" }
jush-backend-permissions = { path = "../backend-permissions" }
jush-plugin-host = { path = "../plugin-host" }
jush-plugin-interface = { path = "../plugin-interface" }
jush-command-protocol = { path = "../command-protocol" }
jush-shared-types = { path = "../shared-types" }
jush-runner-client = { path = "../runner-client", features = ["edge"] }
jush-provider-common = { path = "../provider-common" }
jush-provider-registry = { path = "../provider-registry" }
jush-provider-relay = { path = "../provider-relay" }
jush-runner-protocol = { path = "../runner-protocol" }
jush-shared-lanes = { path = "../shared-lanes" }
jush-device-interface = { path = "../device-interface" }
jush-web-api-protocol = { path = "../web-api-protocol" }
axum = { version = "0.8", features = ["ws"] }
axum-extra = { version = "0.12", features = ["cookie", "typed-header"] }
bytes.workspace = true
cookie = "0.18"
# Request IDs: 80 random bits in lowercase Crockford base-32.
data-encoding = "2"
rand = "0.9"
futures-util.workspace = true
garde.workspace = true
http-body = "1"
# The edge serves its connections itself, each with an idle deadline and a
# close handle (`crates/backend/src/lib.rs`).
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio"] }
mime = "0.3"
# A local store's command artifact, served as it was stored.
object_store.workspace = true
percent-encoding = "2"
# The send buffer of a runner socket connection.
rustix = { version = "1", features = ["net"] }
serde.workspace = true
serde_json.workspace = true
# The content ETag of the web app files a page revalidates.
sha2 = "0.10"
thiserror.workspace = true
async-stream = "0.3"
tokio.workspace = true
tokio-util.workspace = true
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["fs", "trace"] }
tracing.workspace = true
typed-path = "0.12"
uuid = { version = "1", features = ["v4"] }
url = "2"
rust-i18n = "4.2.4"
