[package]
name = "jush-plugin-host"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
# No doc examples.
test = false
doctest = false
bench = false

[dependencies]
jush-command-declarations = { path = "../command-declarations" }
jush-device-interface = { path = "../device-interface" }
jush-device-paths = { path = "../device-paths" }
jush-plugin-interface = { path = "../plugin-interface" }
jush-shared-types = { path = "../shared-types" }
jush-web-api-protocol = { path = "../web-api-protocol" }
# The OAuth pieces every sign-in meets.
jush-provider-common = { path = "../provider-common" }
base64.workspace = true
futures-util.workspace = true
jiff.workspace = true
rand = "0.9"
reqwest = { workspace = true, features = ["rustls"] }
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10"
thiserror.workspace = true
tokio = { workspace = true, features = ["rt", "sync"] }
tokio-util.workspace = true
tracing.workspace = true
url = "2"
