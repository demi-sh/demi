[package]
name = "jush-plugin-skills"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
# No doc examples.
test = false
doctest = false
bench = false

[dependencies]
jush-device-interface = { path = "../../device-interface" }
jush-device-paths = { path = "../../device-paths" }
jush-plugin-interface = { path = "../../plugin-interface" }
jush-shared-types = { path = "../../shared-types" }
jush-web-api-protocol = { path = "../../web-api-protocol" }
futures-util.workspace = true
# The sources' shallow fetch over HTTPS, through the workspace's reqwest.
gix = { version = "0.87", default-features = false, features = ["blocking-http-transport-reqwest-rust-tls", "sha1"] }
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
# A SKILL.md's front matter.
serde-saphyr = { version = "1", default-features = false, features = ["deserialize"] }
sha2 = "0.10"
tempfile = "3"
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
