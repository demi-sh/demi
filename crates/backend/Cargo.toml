[package]
name = "jush-backend"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
# The video makers' tests are the crate's test binary; no doc examples.
test = false
doctest = false
bench = false

[[bin]]
name = "jush-backend"
path = "src/main.rs"
test = false

[dependencies]
jush-shared-artifacts = { path = "../shared-artifacts" }
jush-shared-cli = { path = "../shared-cli" }
jush-backend-accounts = { path = "../backend-accounts" }
jush-backend-cloud = { path = "../backend-cloud" }
jush-backend-http = { path = "../backend-http" }
jush-backend-device-access = { path = "../backend-device-access" }
jush-backend-blobs = { path = "../backend-blobs" }
jush-backend-providers = { path = "../backend-providers" }
jush-backend-runners = { path = "../backend-runners" }
jush-backend-user-shard = { path = "../backend-user-shard" }
jush-backend-database = { path = "../backend-database" }
jush-plugin-browser = { path = "../plugin-browser/plugin" }
jush-plugin-mobile = { path = "../plugin-mobile/plugin" }
jush-plugin-file = { path = "../plugin-file/plugin" }
jush-plugin-interface = { path = "../plugin-interface" }
jush-plugin-skills = { path = "../plugin-skills/plugin" }
jush-plugin-web = { path = "../plugin-web/plugin" }
jush-plugin-image = { path = "../plugin-image/plugin" }
jush-plugin-widget = { path = "../plugin-widget/plugin" }
jush-plugin-video = { path = "../plugin-video/plugin" }
jush-plugin-audio = { path = "../plugin-audio/plugin" }
jush-plugin-changes = { path = "../plugin-changes/plugin" }
jush-plugin-file-browser = { path = "../plugin-file-browser/plugin" }
jush-command-package-browser-protocol = { path = "../plugin-browser/protocol" }
jush-command-declarations = { path = "../command-declarations" }
jush-shared-types = { path = "../shared-types" }
jush-shared-gates = { path = "../shared-gates" }
jush-provider-common = { path = "../provider-common" }
jush-provider-registry = { path = "../provider-registry" }
jush-provider-anthropic-api = { path = "../provider-anthropic-api" }
jush-provider-claude-code = { path = "../provider-claude-code" }
jush-provider-codex = { path = "../provider-codex" }
jush-provider-google = { path = "../provider-google" }
jush-provider-elevenlabs = { path = "../provider-elevenlabs" }
jush-provider-bytedance = { path = "../provider-bytedance" }
jush-provider-minimax = { path = "../provider-minimax" }
jush-provider-grok-build = { path = "../provider-grok-build" }
jush-provider-openai-api = { path = "../provider-openai-api" }
jush-provider-relay = { path = "../provider-relay" }
jush-web-api-protocol = { path = "../web-api-protocol" }
# The management socket's name and default (`crates/server/src/main.rs`), and
# the record of a server update's steps.
jush-runner-protocol = { path = "../runner-protocol" }
clap = { version = "4", features = ["derive", "env"] }
hex = "0.4"
hkdf = "0.12"
rand = "0.9"
sd-notify = "0.5"
serde_json.workspace = true
# The resident memory of the backend's own process, which its resource sample logs.
sysinfo = { version = "0.39", default-features = false, features = ["system"] }
sha2 = "0.10"
thiserror.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
url = { version = "2", features = ["serde"] }

[[test]]
name = "backend"
path = "tests/backend/main.rs"

[dev-dependencies]
bytes.workspace = true
reqwest.workspace = true
# The scripted machine manager (`examples/scripted_machines`), which `xtask dev`
# runs the backend against.
# `testing` for `built_program`, which finds the runner the workspace built.
jush-command-protocol = { path = "../command-protocol", features = ["testing"] }
jush-device-interface = { path = "../device-interface" }
jush-machine-manager-protocol = { path = "../machine-manager-protocol" }
futures-util.workspace = true
rustix = { version = "1", features = ["process"] }
tempfile = "3"
tokio = { workspace = true }
tokio-util.workspace = true
