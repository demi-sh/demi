[package]
name = "xtask"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "xtask"
path = "src/main.rs"
test = false

[dependencies]
jush-shared-artifacts = { path = "../shared-artifacts" }
jush-command-package-browser-protocol = { path = "../plugin-browser/protocol" }
jush-command-package-mobile-protocol = { path = "../plugin-mobile/protocol" }
jush-live-view-protocol = { path = "../live-view-protocol" }
jush-command-package-file-protocol = { path = "../plugin-file/protocol" }
jush-command-package-fetch-protocol = { path = "../plugin-web/protocol" }
jush-command-package-claude-code-protocol = { path = "../command-package-claude-code-protocol" }
# `testing` for `built_program`: `xtask dev` starts the programs the
# workspace built beside it.
jush-command-protocol = { path = "../command-protocol", features = ["testing"] }
jush-shared-types = { path = "../shared-types" }
jush-machine-manager-protocol = { path = "../machine-manager-protocol" }
jush-runner-protocol = { path = "../runner-protocol" }
jush-shared-lanes = { path = "../shared-lanes" }
clap = { version = "4", features = ["derive", "env"] }
flate2 = "1"
# Copies the built web app into a server release.
fs_extra = "1.3"
futures-util.workspace = true
garde.workspace = true
# Plain HTTP to the backend `xtask dev` starts; the one Cargo selection
# builds it with the features the backend gives it.
reqwest.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10"
similar = "2"
# Checks an npm package's license against the accepted ones and gives the
# standard text of one without a license file (`xtask notices`); the
# version cargo-about checks the crates' licenses with.
spdx = { version = "0.13", features = ["text"] }
tar = { version = "0.4", default-features = false }
thiserror.workspace = true
tempfile = "3"
tokio.workspace = true
tokio-util.workspace = true
zstd = { version = "0.13", default-features = false }

[features]
default = ["developer"]
# `xtask contracts`, `xtask dev` and `xtask logos`, which only a developer runs.
# The build workflow builds xtask without them, and so without the backend they
# compile (`.github/workflows/build.yml`).
developer = [
  "dep:jush-backend",
  "dep:jush-provider-common",
  "dep:jush-provider-registry",
  "dep:log",
  "dep:resvg",
  "dep:jush-conversation-lane-protocol",
  "dep:jush-plugin-interface",
  "dep:jush-plugin-widget",
  "dep:jush-web-api-protocol",
  "dep:axum",
  "dep:process-wrap",
]

# What `xtask contracts` and `xtask dev` need, which exist only on Unix: the
# backend builds only where it runs. The plugins the backend registers, whose
# manifests the page packages' types and the plugin page registry are
# generated from; the echo endpoint `xtask dev` serves; the process groups it
# starts its programs in.
[target.'cfg(unix)'.dependencies]
jush-backend = { path = "../backend", optional = true }
# The vendors the backend offers, read from models.dev as it reads them
# (`xtask logos`).
jush-provider-common = { path = "../provider-common", optional = true }
jush-provider-registry = { path = "../provider-registry", optional = true }
# Reads and draws a vendor's mark to tell whether a mask can paint it
# (`xtask logos`).
resvg = { version = "0.48", default-features = false, optional = true }
# usvg's warning that it could not read a mark's color (`xtask logos`).
log = { version = "0.4", optional = true }
jush-conversation-lane-protocol = { path = "../conversation-lane-protocol", optional = true }
jush-plugin-interface = { path = "../plugin-interface", optional = true }
# The guide's widgets the gallery's replies show (`xtask contracts`).
jush-plugin-widget = { path = "../plugin-widget/plugin", optional = true }
jush-web-api-protocol = { path = "../web-api-protocol", optional = true }
axum = { version = "0.8", optional = true }
process-wrap = { workspace = true, optional = true }

# Follows the program that started xtask, to end with it.
[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
rustix = { version = "1", features = ["event", "process"] }
