[package]
name = "jush-backend-user-shard"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
# No doc examples.
test = false
doctest = false
bench = false

[dependencies]
jush-agent-server = { path = "../agent-server" }
jush-conversation-lane-protocol = { path = "../conversation-lane-protocol" }
jush-agent-session = { path = "../agent-session" }
jush-agent-store = { path = "../agent-store" }
jush-agent-tools = { path = "../agent-tools" }
jush-agent-transcript = { path = "../agent-transcript" }
jush-backend-accounts = { path = "../backend-accounts" }
jush-backend-cloud = { path = "../backend-cloud" }
jush-backend-device-access = { path = "../backend-device-access" }
jush-backend-idle-watch = { path = "../backend-idle-watch" }
jush-backend-blobs = { path = "../backend-blobs" }
jush-backend-providers = { path = "../backend-providers" }
jush-backend-runners = { path = "../backend-runners" }
jush-backend-database = { path = "../backend-database" }
jush-backend-page-sync = { path = "../backend-page-sync" }
jush-backend-permissions = { path = "../backend-permissions" }
jush-command-package-claude-code-protocol = { path = "../command-package-claude-code-protocol" }
jush-plugin-host = { path = "../plugin-host" }
jush-plugin-interface = { path = "../plugin-interface" }
jush-command-protocol = { path = "../command-protocol" }
jush-command-declarations = { path = "../command-declarations" }
jush-shared-artifacts = { path = "../shared-artifacts" }
jush-shared-types = { path = "../shared-types", features = ["audio", "mp4"] }
jush-shared-gates = { path = "../shared-gates" }
jush-runner-client = { path = "../runner-client" }
jush-machine-manager-protocol = { path = "../machine-manager-protocol" }
jush-provider-common = { path = "../provider-common" }
jush-provider-registry = { path = "../provider-registry" }
jush-provider-relay = { path = "../provider-relay" }
jush-provider-claude-code = { path = "../provider-claude-code" }
jush-runner-protocol = { path = "../runner-protocol" }
jush-device-interface = { path = "../device-interface" }
jush-device-paths = { path = "../device-paths" }
jush-web-api-protocol = { path = "../web-api-protocol" }
axum = { version = "0.8", features = ["ws"] }
base64.workspace = true
bytes.workspace = true
async-stream = "0.3"
futures-util.workspace = true
http.workspace = true
garde.workspace = true
object_store.workspace = true
sysinfo = { version = "0.39", default-features = false, features = ["disk"] }
rand = "0.9"
reqwest = { workspace = true, features = ["rustls", "stream"] }
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10"
hex = "0.4"
hmac = "0.12"
subtle = "2"
thiserror.workspace = true
semver.workspace = true
tokio.workspace = true
tokio-util.workspace = true
jiff = { workspace = true, features = ["tz-system", "tzdb-bundle-platform"] }
tracing.workspace = true
url = "2"
uuid = { version = "1", features = ["v4"] }
# The public holidays a schedule's working days skip, kept compressed.
zstd = { version = "0.13", default-features = false }
