[package]
name = "jush-browser"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
# No doc examples.
test = false
doctest = false
bench = false

[[bin]]
name = "jush-browser"
path = "src/main.rs"
test = false

[dependencies]
bytes.workspace = true
jush-command-package-browser-chrome = { path = "../command-chrome" }
jush-command-package-browser-protocol = { path = "../protocol" }
jush-command-protocol = { path = "../../command-protocol" }
jush-command-sdk = { path = "../../command-sdk" }
jush-shared-cli = { path = "../../shared-cli", features = ["device-allocator"] }
jush-shared-openh264 = { path = "../../shared-openh264" }
jush-shared-recording = { path = "../../shared-recording" }
jush-shared-recording-protocol = { path = "../../shared-recording-protocol" }
futures-util.workspace = true
png = "0.18"
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tracing.workspace = true
