[package]
name = "jush-agent-server"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
# No doc examples.
test = false
doctest = false
bench = false

[features]
# A client that drives a connection (`agent::testing`), for the compaction
# fixture's harness.
testing = []

[dependencies]
bytes.workspace = true
# Reads a user message's Markdown for the title it gives.
comrak = { version = "0.56", default-features = false }
jush-conversation-lane-protocol = { path = "../conversation-lane-protocol" }
jush-agent-session = { path = "../agent-session" }
jush-agent-store = { path = "../agent-store" }
jush-agent-tools = { path = "../agent-tools" }
jush-agent-transcript = { path = "../agent-transcript" }
jush-shared-types = { path = "../shared-types" }
jush-shared-gates = { path = "../shared-gates" }
jush-provider-common = { path = "../provider-common" }
jush-device-interface = { path = "../device-interface" }
jush-device-paths = { path = "../device-paths" }
futures-util.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-util.workspace = true
regex = "1"
tracing.workspace = true

[dev-dependencies]
# The compaction fixture's harness (`fixtures/compaction/README.md`) talks
# to a real model with the crate's test support. It is an example, so every
# build of the one selection compiles it and no test runs it; its provider is a
# dev-dependency, so the library never links one.
jush-agent-server = { path = ".", features = ["testing"] }
jush-agent-store = { path = "../agent-store", features = ["testing"] }
jush-agent-tools = { path = "../agent-tools", features = ["testing"] }
jush-provider-openai-api = { path = "../provider-openai-api" }
flate2 = "1"
reqwest.workspace = true

[[example]]
name = "compaction-fixture"
path = "fixtures/compaction/main.rs"
