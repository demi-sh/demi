[package]
name = "jush-agent-transcript"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
# No doc examples.
test = false
doctest = false
bench = false

[features]
# Predictable identities (`agent_transcript::testing`), with the store's test
# support below them.
testing = ["jush-agent-store/testing"]

[dependencies]
jush-conversation-lane-protocol = { path = "../conversation-lane-protocol" }
jush-agent-store = { path = "../agent-store" }
jush-shared-types = { path = "../shared-types" }
jush-provider-common = { path = "../provider-common" }
comrak = { version = "0.56", default-features = false }
percent-encoding = "2"
regex = "1"
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
uuid = { version = "1", features = ["v4"] }
