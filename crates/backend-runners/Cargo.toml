[package]
name = "jush-backend-runners"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
# No doc examples.
test = false
doctest = false
bench = false

[dependencies]
jush-shared-artifacts = { path = "../shared-artifacts" }
jush-backend-blobs = { path = "../backend-blobs" }
jush-backend-database = { path = "../backend-database" }
jush-backend-page-sync = { path = "../backend-page-sync" }
jush-command-protocol = { path = "../command-protocol" }
jush-shared-gates = { path = "../shared-gates" }
jush-runner-client = { path = "../runner-client", features = ["edge"] }
jush-runner-protocol = { path = "../runner-protocol" }
jush-device-interface = { path = "../device-interface" }
jush-web-api-protocol = { path = "../web-api-protocol" }
# A runner's connection is the WebSocket the edge upgraded.
axum = { version = "0.8", features = ["ws"] }
bytes.workspace = true
data-encoding = "2"
futures-util.workspace = true
hex = "0.4"
jiff.workspace = true
object_store = { workspace = true, features = ["aws", "fs"] }
percent-encoding = "2"
rand = "0.9"
semver.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_json_canonicalizer = "0.3"
shlex = "2"
thiserror.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tracing.workspace = true
url = { version = "2", features = ["serde"] }
