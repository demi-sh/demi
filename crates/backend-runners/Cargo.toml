[package]
name = "demi-backend-runners"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
# No doc examples.
test = false
doctest = false
bench = false

[dependencies]
demi-core-devices = { path = "../core-devices" }
demi-shared-artifacts = { path = "../shared-artifacts" }
demi-core-blobs = { path = "../core-blobs" }
demi-core-store = { path = "../core-store" }
demi-command-protocol = { path = "../command-protocol" }
demi-runner-client = { path = "../runner-client", features = ["edge"] }
demi-runner-protocol = { path = "../runner-protocol" }
demi-device-interface = { path = "../device-interface" }
demi-web-api-protocol = { path = "../web-api-protocol" }
# A runner's connection is the WebSocket the edge upgraded.
axum = { version = "0.8", features = ["ws"] }
bytes.workspace = true
futures-util.workspace = true
jiff.workspace = true
object_store = { workspace = true, features = ["aws", "fs"] }
percent-encoding = "2"
semver.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_json_canonicalizer = "0.3"
shlex = "2"
thiserror.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tracing.workspace = true
url = { version = "2", features = ["serde"] }
